# Fra-kilde-byggede GIS-libs i docker/Dockerfile som syft ikke fanger som pakker.
# Pins SKAL holdes i sync med docker/Dockerfile ved hver image-version (php8.4-N).
# Hvor 'purl' udelades, genereres pkg:generic/<name>@<version>.
# 'source' er ren dokumentation i denne fil; gis_components_to_cyclonedx() laeser
# kun name/version/purl/notes.
#
# Beskriver standard-bygningen: ECW_VERSION=3, PHP_VERSION=8.4, NODE_VERSION=24,
# DEBIAN_CODENAME=trixie. Senest afstemt med docker/Dockerfile 2026-11-03
# (efter 55d993d9, som skiftede MapServer og MapCache ud).
components:
  - name: gdal
    version: "3.12.4"
    source: "https://download.osgeo.org/gdal/3.12.4/gdal3124.zip"
    notes: >-
      Bygget med ECW 3.3 + LibKML + Arrow/Parquet (GeoParquet) i gdal3-stagen
      (ECW_VERSION=3). Arrow/Parquet-libs kommer fra Apache's apt-suite pinnet til
      ARROW_VERSION=25.0.1-1 og fanges af syft som deb-pakker. ECW_VERSION=5 bygger
      i stedet gdal5-stagen: GDAL 3.5.3 mod Hexagon ECW/JP2 SDK 5.3 og uden LibKML.
  - name: mapserver
    version: "8.6.6"
    purl: "pkg:github/MapServer/MapServer@rel-8-6-6"
    source: "https://github.com/MapServer/MapServer.git"
    notes: >-
      Upstream MapServer paa tag rel-8-6-6. Erstattede i 55d993d9 (2026-09-30) den
      tidligere mapcentia/mapserver rsvg_fix-branch, som var en ikke-pinnet
      branch-klon. Bygget med RSVG, PHPNG (php_mapscriptng.so), KML/LibKML/KMZ, SOS,
      WFS/WMS-client, CURL og POINT_Z_M; CMAKE_INSTALL_PREFIX=/opt.
  - name: mapcache
    version: "1.16.0"
    purl: "pkg:github/mapserver/mapcache@rel-1-16-0"
    source: "http://github.com/mapserver/mapcache.git"
    notes: >-
      Tag rel-1-16-0 (var branch-1-12 indtil 55d993d9). Bygget med WITH_MEMCACHE=1
      mod apr-util's indbyggede apr_memcache (libaprutil1-dev), fordi
      libapr-memcache-dev ikke findes i trixie.
  - name: swig
    version: "master"
    purl: "pkg:github/swig/swig@master"
    source: "https://github.com/swig/swig.git"
    notes: >-
      Kloned fra master (--depth 1), ikke pinnet: samme image-version kan indeholde
      forskellige swig-commits. Kraeves > 4.0.0 for PHP8-support til MapScript.
  - name: ogr2postgis
    version: "gui"
    purl: "pkg:github/mapcentia/ogr2postgis@gui"
    source: "https://github.com/mapcentia/ogr2postgis.git"
    notes: "Branch-klon af 'gui' (--depth 1), ikke pinnet til en commit"
  - name: libecwj2
    version: "3.3"
    source: "https://s3-eu-west-1.amazonaws.com/mapcentia-www/software/libecwj2-3.3-2006-09-06.zip"
    notes: >-
      ECW/JPEG2000 SDK 3.3 under ECW JPEG 2000 SDK Public Use License Agreement.
      Patchet med libecwj2-3.3-msvc90-fixes, -wcharfix og
      -NCSPhysicalMemorySize-Linux fra samme bucket. ECW_VERSION-build-arg styrer
      3.3 (ecw3) vs Hexagon ERDAS ECW/JP2 SDK 5.3 (ecw5, proprietaer, ikke
      distribueret med GC2).
  - name: qgis-server
    version: "apt-ltr"
    source: "https://qgis.org/debian-ltr"
    notes: >-
      Apt-pakke fra qgis.org debian-ltr for ${DEBIAN_CODENAME}; ikke bygget fra
      kilde, men suiten er LTR-rullende, saa den faktiske version aflaeses i imaget
      og fanges af syfts deb-cataloger.
